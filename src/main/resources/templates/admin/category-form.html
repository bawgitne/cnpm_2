<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_layout}">
<head>
    <title th:text="${isEdit ? 'Chỉnh Sửa Danh Mục' : 'Thêm Danh Mục Mới'}">Form Danh Mục</title>
</head>
<body>

    <div layout:fragment="content">

        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-1" th:text="${isEdit ? 'Chỉnh Sửa Danh Mục' : 'Thêm Danh Mục Mới'}">
                    Thêm Danh Mục Mới
                </h3>
                <p class="text-muted small mb-0">Nhập thông tin danh mục cần lưu vào hệ thống</p>
            </div>
            <a th:href="@{/admin/categories}" class="btn btn-outline-secondary rounded-pill px-3">
                <i class="fa-solid fa-arrow-left me-1"></i> Quay Lại Danh Sách
            </a>
        </div>

        <!-- Form Card -->
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-custom">
                    <div class="card-header-custom d-flex align-items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-primary"></i>
                        <span class="fw-bold" th:text="${isEdit ? 'Cập Nhật Thông Tin Danh Mục' : 'Tạo Danh Mục Mới'}">Form Nhập</span>
                    </div>
                    
                    <div class="card-body p-4">
                        <form th:action="@{/admin/categories/save}" 
                              th:object="${category}" 
                              method="post" 
                              enctype="multipart/form-data">
                            
                            <!-- Hidden ID Field -->
                            <input type="hidden" th:field="*{categoryid}" />
                            <input type="hidden" th:field="*{images}" />

                            <!-- Category ID (Display when edit) -->
                            <div class="mb-3" th:if="${isEdit}">
                                <label class="form-label fw-semibold text-muted">ID Danh Mục</label>
                                <input type="text" class="form-control bg-light" th:value="*{categoryid}" disabled />
                            </div>

                            <!-- Category Name -->
                            <div class="mb-4">
                                <label for="categoryname" class="form-label fw-semibold">Tên Danh Mục <span class="text-danger">*</span></label>
                                <input type="text" id="categoryname" th:field="*{categoryname}" 
                                       class="form-control form-control-lg" 
                                       placeholder="Nhập tên danh mục (ví dụ: Điện thoại, Laptop...)" required />
                            </div>

                            <!-- Status Selection -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Trạng Thái <span class="text-danger">*</span></label>
                                <div class="d-flex gap-4 pt-1">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" th:field="*{status}" id="statusActive" value="1" checked>
                                        <label class="form-check-label fw-medium text-success" for="statusActive">
                                            <i class="fa-solid fa-circle-check me-1"></i> Hoạt động
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" th:field="*{status}" id="statusInactive" value="0">
                                        <label class="form-check-label fw-medium text-danger" for="statusInactive">
                                            <i class="fa-solid fa-circle-xmark me-1"></i> Khóa / Tạm ngưng
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Image Upload -->
                            <div class="mb-4">
                                <label for="imageFile" class="form-label fw-semibold">Hình Ảnh Danh Mục</label>
                                <input type="file" id="imageFile" name="imageFile" class="form-control" accept="image/*" />
                                <div class="form-text">Chấp nhận định dạng PNG, JPG, JPEG (Tối đa 10MB)</div>
                                
                                <!-- Image Preview if edit -->
                                <div class="mt-3" th:if="${category.images != null and !category.images.isEmpty()}">
                                    <span class="d-block small text-muted mb-2">Hình ảnh hiện tại:</span>
                                    <img th:if="${category.images.startsWith('http')}" th:src="${category.images}" 
                                         class="rounded border shadow-sm" width="100" height="100" style="object-fit: cover;" />
                                    <img th:if="${!category.images.startsWith('http')}" th:src="@{/images/user.png}" 
                                         class="rounded border shadow-sm" width="100" height="100" style="object-fit: cover;" />
                                </div>
                            </div>

                            <hr class="my-4 text-secondary border-opacity-25">

                            <!-- Submit Buttons -->
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/admin/categories}" class="btn btn-light px-4">Hủy Bỏ</a>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                    <i class="fa-solid fa-floppy-disk me-1"></i>
                                    <span th:text="${isEdit ? 'Cập Nhật' : 'Lưu Danh Mục'}">Lưu</span>
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
